<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Alke Wallet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
        }

        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Alke Wallet</h1>

    <h2>Iniciar sesión</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>

</html>
