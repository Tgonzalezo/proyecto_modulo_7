{% extends 'gestion/base.html' %}

{% block contenido %}

<h1>Eliminar cliente</h1>

<p>
    ¿Estás seguro de que deseas eliminar a
    <strong>{{ object.nombre }} {{ object.apellido }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

</form>

<br>

<a href="{% url 'clientes' %}">
    Cancelar
</a>

{% endblock %}
