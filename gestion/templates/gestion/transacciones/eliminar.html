{% extends 'gestion/base.html' %}

{% block contenido %}

<h1>Eliminar transacción</h1>

<p>
    ¿Estás seguro de que deseas eliminar esta transacción?
</p>

<p>
    <strong>Cuenta:</strong> {{ object.cuenta.numero_cuenta }}
</p>

<p>
    <strong>Tipo:</strong> {{ object.get_tipo_display }}
</p>

<p>
    <strong>Monto:</strong> ${{ object.monto }}
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Sí, eliminar
    </button>

</form>

<br>

<a href="{% url 'transacciones' %}">
    Cancelar
</a>

{% endblock %}
